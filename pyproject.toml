[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certificat-core"
dynamic = ["version"]
description = "Headless PKCS#12 certificate and private-key extraction core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
test = ["PySide6>=6.7,<7"]

[project.scripts]
certificat = "certificat.__main__:main"

[project.gui-scripts]
certificat-gui = "certificat.presentation.app:main"

[tool.setuptools.dynamic]
version = {attr = "certificat._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

