name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            python-version: "3.10"
          - name: Windows x64
            os: windows-2025
            python-version: "3.12"
          - name: macOS Apple Silicon
            os: macos-15
            python-version: "3.12"
          - name: macOS Intel
            os: macos-15-intel
            python-version: "3.10"
          - name: macOS Intel
            os: macos-15-intel
            python-version: "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Select OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: python -m pip install --upgrade --editable ".[test]"

      - name: Show runtime versions
        run: |
          python --version
          openssl version -a
          python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Run unit and integration tests
        run: python tests/ci_runner.py

      - name: Check installed entry points
        run: |
          certificat --version
          python -c "from certificat.presentation.app import main; print(main.__module__)"
